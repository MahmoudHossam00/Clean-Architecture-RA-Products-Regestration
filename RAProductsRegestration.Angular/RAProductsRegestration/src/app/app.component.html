@if (showApplicationShell) {

  <div class="application">

    <a
      class="skip-link"
      href="#main-content">

      Skip to main content

    </a>


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="topbar">


      <!-- ===================================================
           Brand
           =================================================== -->

      <a
        class="brand"
        routerLink="/products"
        aria-label="RA Workspace — Products home">

        <span
          class="brand-logo"
          aria-hidden="true">

          <svg
            viewBox="0 0 28 28"
            fill="none">

            <path
              d="M14 3 24 7v7c0 6-10 11-10 11S4 20 4 14V7L14 3Z"
              stroke="currentColor"
              stroke-width="1.6">
            </path>

            <path
              d="M14 9v10M9 14h10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round">
            </path>

          </svg>

        </span>


        <span class="brand-text">

          <strong>
            RA Workspace
          </strong>

          <span>
            Products Registration
          </span>

        </span>

      </a>


      <!-- ===================================================
           Navigation
           =================================================== -->

      <nav
        class="top-navigation"
        aria-label="Main navigation">


        <!-- Products -->

        <a
          routerLink="/products"
          routerLinkActive="active"
          ariaCurrentWhenActive="page">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true">

            <rect
              x="3"
              y="3"
              width="7"
              height="7"
              rx="1.5">
            </rect>

            <rect
              x="14"
              y="3"
              width="7"
              height="7"
              rx="1.5">
            </rect>

            <rect
              x="3"
              y="14"
              width="7"
              height="7"
              rx="1.5">
            </rect>

            <rect
              x="14"
              y="14"
              width="7"
              height="7"
              rx="1.5">
            </rect>

          </svg>

          Products

        </a>


        <!-- ===============================================
             ADMIN ONLY
             =============================================== -->

        @if (isAdmin) {

          <!-- Employee Import -->

          <a
            routerLink="/admin/employees"
            routerLinkActive="active"
            ariaCurrentWhenActive="page">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true">

              <path
                d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2">
              </path>

              <circle
                cx="9"
                cy="7"
                r="4">
              </circle>

              <path
                d="M19 8v6">
              </path>

              <path
                d="M22 11h-6">
              </path>

            </svg>

            Import Employees

          </a>


          <!-- Create User -->

          <a
            routerLink="/admin/users/create"
            routerLinkActive="active"
            ariaCurrentWhenActive="page">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true">

              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2">
              </path>

              <circle
                cx="12"
                cy="7"
                r="4">
              </circle>

              <path
                d="M19 8h4">
              </path>

              <path
                d="M21 6v4">
              </path>

            </svg>

            Create User

          </a>

        }

      </nav>


      <!-- ===================================================
           User / Logout
           =================================================== -->

      <div class="workspace-actions">


        @if (displayName) {

          <div class="current-user">

            <span class="current-user-label">
              Signed in as
            </span>

            <strong>
              {{ displayName }}
            </strong>

          </div>

        }


        <span
          class="workspace-mark"
          aria-hidden="true">

          RA

        </span>


        <button
          type="button"
          class="logout-button"
          (click)="logout()">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true">

            <path
              d="M10 17l5-5-5-5"
              stroke-linecap="round"
              stroke-linejoin="round">
            </path>

            <path
              d="M15 12H3"
              stroke-linecap="round">
            </path>

            <path
              d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"
              stroke-linecap="round">
            </path>

          </svg>

          <span>
            Logout
          </span>

        </button>

      </div>

    </header>


    <!-- =====================================================
         CONTENT
         ===================================================== -->

    <main
      id="main-content"
      class="application-content"
      tabindex="-1">

      <router-outlet />

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="application-footer">

      <span>
        RA Workspace

        <span aria-hidden="true">
          /
        </span>

        Products Registration
      </span>


      <span>
        Regulatory Affairs
      </span>

    </footer>

  </div>

}
@else {

  <!-- Login / First Login do not show navbar/footer -->

  <router-outlet />

}
